services:
  app:
    build: .
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3001}
      PORT: 3001
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    profiles: [database]
    environment:
      POSTGRES_USER: syncwave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: syncwave
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:
